name: Sigma COS CI

on:
  push:
    branches: [main]
    paths:
      - 'sigma-cos/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sigma-cos/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  sigma-cos:
    runs-on: ubuntu-latest
    name: Validate Sigma COS runtime
    defaults:
      run:
        working-directory: sigma-cos
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config

      - name: Start runtime and wait for health
        run: docker compose up -d --wait --wait-timeout 90

      - name: Inspect runtime state
        run: docker compose ps

      - name: Run end-to-end smoke test
        run: bash tests/smoke.sh

      - name: Collect runtime state and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300 mcp-router
          docker compose logs --no-color --tail=300 factory-worker
          docker compose logs --no-color --tail=300 ai-sidecar

      - name: Shutdown runtime
        if: always()
        run: docker compose down -v
