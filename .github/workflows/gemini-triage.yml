name: '🔀 Gemini Triage'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-triage-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  triage:
    runs-on: 'ubuntu-latest'
    env:
      GEMINI_AUTH_AVAILABLE: '${{ env.GEMINI_AUTH_AVAILABLE == 'true' }}'
    timeout-minutes: 7
    outputs:
      available_labels: '${{ steps.get_labels.outputs.available_labels }}'
      selected_labels: '${{ steps.classify.outputs.selected_labels }}'
      execution_mode: '${{ steps.classify.outputs.execution_mode }}'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Get repository labels'
        id: 'get_labels'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          script: |-
            const labels = [];
            for await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })) labels.push(...response.data);
            const labelNames = labels.map(label => label.name).sort();
            core.setOutput('available_labels', labelNames.join(','));
            core.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);

      - name: 'Run Gemini issue analysis'
        id: 'gemini_analysis'
        if: |-
          ${{ secrets.GEMINI_API_KEY != '' || secrets.GOOGLE_API_KEY != '' || vars.GCP_WIF_PROVIDER != '' }}
        continue-on-error: true
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          GITHUB_TOKEN: ''
          ISSUE_TITLE: '${{ github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.issue.body }}'
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-triage'
          settings: |
            {
              "model": {"maxSessionTurns": 25},
              "telemetry": {"enabled": true, "target": "local", "outfile": ".gemini/telemetry.log"},
              "tools": {"core": ["run_shell_command(echo)"]}
            }
          prompt: '/gemini-triage'

      - name: 'Classify request and establish execution state'
        id: 'classify'
        env:
          TITLE: '${{ github.event.issue.title }}'
          BODY: '${{ github.event.issue.body }}'
          AVAILABLE_LABELS: '${{ steps.get_labels.outputs.available_labels }}'
          GEMINI_OUTCOME: '${{ steps.gemini_analysis.outcome }}'
        run: |-
          set -euo pipefail
          text="${TITLE} ${BODY}"
          labels=""
          if grep -Eiq 'security|auth|secret|credential|token|permission|safety' <<< "${text}"; then
            labels="bug"
          elif grep -Eiq 'doc|readme|documentation|guide|policy' <<< "${text}"; then
            labels="documentation"
          elif grep -Eiq 'ci|workflow|deploy|docker|build|pipeline|github action' <<< "${text}"; then
            labels="bug"
          elif grep -Eiq 'feature|enhancement' <<< "${text}"; then
            labels="enhancement"
          else
            labels="question"
          fi

          IFS=',' read -r -a available <<< "${AVAILABLE_LABELS}"
          selected=""
          for candidate in ${labels//,/ }; do
            for available_label in "${available[@]}"; do
              if [[ "${candidate}" == "${available_label}" ]]; then
                selected="${candidate}"
              fi
            done
          done

          if [[ "${GEMINI_OUTCOME}" == "success" ]]; then
            mode="gemini"
          else
            mode="deterministic-fallback"
          fi
          echo "selected_labels=${selected}" >> "${GITHUB_OUTPUT}"
          echo "execution_mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "Execution mode: ${mode}; selected label: ${selected}"

      - name: 'Record accepted fallback when AI provider is unavailable'
        if: |-
          ${{ steps.classify.outputs.execution_mode == 'deterministic-fallback' }}
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --body "Agent dispatch accepted. Gemini provider was unavailable or failed authentication, so deterministic triage fallback completed. Execution state is verified; AI-provider state remains BLOCKED. Run: ${RUN_URL}"

  label:
    runs-on: 'ubuntu-latest'
    needs: ['triage']
    if: |-
      ${{ needs.triage.outputs.selected_labels != '' }}
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: '${{ vars.APP_ID }}'
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Apply labels'
        env:
          ISSUE_NUMBER: '${{ github.event.issue.number }}'
          AVAILABLE_LABELS: '${{ needs.triage.outputs.available_labels }}'
          SELECTED_LABELS: '${{ needs.triage.outputs.selected_labels }}'
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          github-token: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          script: |-
            const available = (process.env.AVAILABLE_LABELS || '').split(',').map(x => x.trim()).filter(Boolean);
            const selected = (process.env.SELECTED_LABELS || '').split(',').map(x => x.trim()).filter(x => available.includes(x));
            if (selected.length) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(process.env.ISSUE_NUMBER),
                labels: selected,
              });
              core.info(`Applied labels: ${selected.join(', ')}`);
            }
