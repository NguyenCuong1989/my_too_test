name: no-drift-gate

on:
  push:
  pull_request:

jobs:
  no-drift-invariants:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository no-drift invariants
        run: python3 -m unittest tests.test_bridge_no_drift -v
