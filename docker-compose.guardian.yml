services:
  aios-guardian:
    build:
      context: .
      dockerfile: Dockerfile.guardian
    container_name: aios-guardian
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - BASE_DIR=/app
      - NODE_ID=ETERNAL_CLOUD_GUARDIAN_LOCAL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; exit(0 if os.path.exists('/app/autonomous_operator/eternal_guardian.py') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aios-net

networks:
  aios-net:
    driver: bridge
